name: videostudio-saas

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: videostudio_user
      POSTGRES_PASSWORD: videostudio_password
      POSTGRES_DB: videostudio_db
    volumes:
      - videostudio_postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5437:5432"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://videostudio_user:videostudio_password@db:5432/videostudio_db
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - ./uploads:/app/uploads
    command: sh -c "sleep 5 && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./core:/app
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "5175:5173"
    command: sh -c "if [ ! -d node_modules ]; then npm install; fi && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  videostudio_postgres_data:
  media_uploads:
